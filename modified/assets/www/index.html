<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>信笺·运行版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="bridge.js"></script>
<script src="highlight.js"></script>
<script src="md.js"></script>
<script src="anim.js"></script>
<script src="navindicator.js"></script>
<!-- 卡片光斑：事件委托，视图里不用写挂载代码（见 spotlight.js 头注释） -->
<script src="spotlight.js"></script>
<!-- 主题切换按钮：只做「圆形揭示」，换色仍走 app.js 的 applyTheme()，
     所以它排在 app.js 前后都能工作（函数在点击时才用） -->
<script src="themereveal.js"></script>
<!-- 拆分后的加载顺序不能乱：
     app.js(核心工具) → data.js(数据层) → views/*(各视图) → boot.js(启动)
     app.js 必须最先（后面都用 esc/svg/toast/sheet），boot.js 必须最后（要 Nav.render()） -->
<script src="app.js"></script>
<script src="data.js"></script>
<script src="views/home.js"></script>
<script src="views/shelf.js"></script>
<script src="views/create.js"></script>
<script src="run-formats.js"></script>
<script src="runner.js"></script>
<script src="views/editor.js"></script>
<script src="views/me.js"></script>
<script src="views/chat.js"></script>
<script src="boot.js"></script>
</body>
</html>
